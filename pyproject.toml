[project]
name = "ml-sandbox"
version = "0.11.0"
description = "Small, inspectable notebooks for learning deep-learning training mechanics"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "altair>=5.5",
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "nbmake>=1.5",
    "nbconvert>=7.16",
    "pyrefly>=0.31",
    "pytest>=8.3",
    "rich>=14.0",
    "ruff>=0.9",
    "torch>=2.5",
    "vl-convert-python>=1.8",
    "numpy>=2.4",
    "scipy>=1.17",
    "matplotlib>=3.9",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["**/test_*.py"]

[tool.ruff]
line-length = 100
